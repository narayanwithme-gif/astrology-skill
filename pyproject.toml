[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-astrology"
version = "1.4.0"
description = "Local Western and Jyotisha chart calculations for a Hermes astrology skill"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pyswisseph==2.10.3.2", "tzdata==2026.2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
]

[project.scripts]
hermes-astrology = "chart_engine:cli"

[tool.setuptools]
py-modules = ["chart_engine"]
package-dir = {"" = "scripts"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
