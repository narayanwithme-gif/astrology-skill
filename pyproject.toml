[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-astrology"
version = "1.5.0"
description = "Local Western and Jyotisha chart calculations for a Hermes astrology skill"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pyswisseph==2.10.3.2", "tzdata==2026.2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Utilities",
]

[project.optional-dependencies]
# The full Jyotisha catalog is intentionally opt-in: PyJHora includes large
# desktop and geocoding dependencies, while this project's core stays small.
vedic-full = ["PyJHora==5.0.6"]

[project.scripts]
hermes-astrology = "chart_engine:cli"
hermes-astrology-svg = "svg_export:cli"
hermes-astrology-api = "chart_api:main"
hermes-vedic-calendar = "vedic_calendar:cli"
hermes-vedic-full = "vedic_extensions:cli"
hermes-vedic-predictions = "vedic_predictions:cli"
hermes-report-visuals = "report_visuals:cli"

[tool.setuptools]
py-modules = [
    "chart_engine", "engine_utils", "advanced", "composite_charts", "progressions",
    "relocation", "shadbala", "ashtakavarga", "kp_system", "svg_export", "chart_api",
    "vedic_calendar", "vedic_extensions", "vedic_predictions", "report_visuals",
]
package-dir = {"" = "scripts"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
