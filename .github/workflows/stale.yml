name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 0 * * *'  # daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 7
          days-before-pr-stale: 30
          days-before-pr-close: 7
          exempt-issue-labels: 'priority-high,bug'
          exempt-pr-labels: 'priority-high'
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity. It will be closed if no further activity occurs
            within 7 days. To keep it open, add a comment or apply the
            `priority-high` label.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity. It will be closed if no further activity
            occurs within 7 days. To keep it open, add a comment or apply the
            `priority-high` label.
          close-issue-message: >
            This issue was closed due to inactivity. If this is still relevant,
            please reopen or create a new issue.
          close-pr-message: >
            This pull request was closed due to inactivity. If this is still
            relevant, please reopen or submit a new PR.
          remove-stale-when-updated: true
          debug-only: false
